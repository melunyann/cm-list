<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料まとめシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pp: #F1F3ED; --cd: #FFFFFF; --ik: #26302A; --is: #6E786E; --if: #A2AB9C;
    --ln: #E1E6DB; --ls: #CBD4C3; --ac: #A9863C; --dg: #9A4A42; --rd: 4px;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--pp); color: var(--ik);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  #app{ max-width: 1100px; margin: 0 auto; padding: 28px 20px 70px; }

  .page-head{ margin-bottom: 20px; border-bottom: 1px solid var(--ls); padding-bottom: 16px; }
  .page-head h1{ font-family: 'Zen Old Mincho', serif; font-weight: 700; font-size: 24px; margin: 0 0 6px; letter-spacing: .05em; }
  .page-head p{ font-size: 13px; color: var(--is); margin: 0; }

  .tool-nav{ display:flex; gap: 4px; margin-bottom: 16px; }
  .tool-nav a{
    background: var(--cd); border: 1px solid var(--ls); color: var(--is);
    padding: 8px 18px; font-size: 13px; text-decoration: none; border-radius: var(--rd);
  }
  .tool-nav a.active{ background: var(--ik); color: #fff; border-color: var(--ik); }
  .tool-nav a:hover:not(.active){ border-color: var(--ac); color: var(--ac); }

  .mode-tabs{ display:flex; gap: 4px; margin-bottom: 18px; }
  .mode-tabs button{
    background: var(--cd); border: 1px solid var(--ls); color: var(--is);
    padding: 8px 20px; font-size: 13.5px; font-family: inherit; cursor: pointer; border-radius: var(--rd);
  }
  .mode-tabs button.active{ background: var(--ik); color: #fff; border-color: var(--ik); }

  .btn-primary{
    background: var(--ik); color: #fff; border: none; padding: 11px 22px;
    border-radius: var(--rd); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 18px;
  }
  .btn-primary:hover{ background: #14190f; }

  .canvas-wrap{ background: var(--cd); border: 1px solid var(--ln); border-radius: var(--rd); padding: 20px; overflow: hidden; }
  .canvas-scale-box{ position: relative; }

  .sheet{ display:flex; gap: 0; background:#fff; position: absolute; top: 0; left: 0; }
  .info-panel{ display:flex; flex-direction:column; border: 1px solid #ddd; }
  .panel-text{
    flex: 0 0 56%; border-bottom: 1px solid #ddd; padding: 12px 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }
  .field-block label{
    display:block; font-size: 11px; font-weight: 700; color: #7a8a76;
    margin-bottom: 3px; letter-spacing: .04em;
  }
  .field-block textarea{
    width: 100%; border: 1px solid #eee; border-radius: 2px; resize: vertical;
    outline: none; padding: 5px 7px;
    font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12.5px; line-height: 1.6; color: #26302A;
  }
  .field-block textarea:focus{ border-color: var(--ac); }

  .panel-bottom{ flex: 1; padding: 10px 14px; display:flex; flex-direction:column; gap: 8px; min-height: 0; }
  .face-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .img-slot{
    position: relative; width: 100%; background: #F4F4F2; border: 1px dashed var(--ls);
    border-radius: 2px; cursor: pointer; overflow: hidden;
  }
  .img-slot.face-slot::before{ content:''; display:block; padding-top: 100%; }
  .img-slot .slot-img{ position:absolute; inset:0; width:100%; height:100%; object-fit: cover; }
  .img-slot .plus{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color: var(--if); font-size: 22px; }
  .img-slot .edit-mark{
    position:absolute; bottom: 4px; right: 4px; background: rgba(38,48,42,.65); color:#fff;
    font-size: 10px; padding: 2px 6px; border-radius: 8px;
  }
  .face-controls{ display:flex; gap: 8px; }
  .face-controls button{
    background: none; border: 1px solid var(--ls); color: var(--is); font-size: 11.5px;
    padding: 4px 10px; border-radius: var(--rd); cursor: pointer; font-family: inherit;
  }
  .face-controls button:hover{ border-color: var(--ac); color: var(--ac); }

  .palette-row{ display:flex; align-items:center; gap: 6px; flex-wrap: wrap; }
  .swatch{ width: 22px; height: 22px; border-radius: 3px; border: 1px solid #ccc; cursor: pointer; }
  .add-color-btn{
    width: 22px; height: 22px; border-radius: 3px; border: 1px dashed var(--ls); background: #fff;
    color: var(--if); font-size: 13px; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .add-color-btn:hover{ border-color: var(--ac); color: var(--ac); }

  .illust-pair{ display:flex; flex-direction:row; }
  .illust-pair .img-slot{ flex: 1; }
  .illust-pair .img-slot + .img-slot{ border-left: none; }

  /* ===== crop modal ===== */
  .crop-overlay{
    position: fixed; inset: 0; background: rgba(20,25,20,.6);
    display:flex; align-items:center; justify-content:center; z-index: 1000; padding: 20px;
  }
  .crop-box{ background:#fff; border-radius: 6px; padding: 18px; width: 100%; max-width: 420px; }
  .crop-box h4{ margin: 0 0 12px; font-size: 13px; color: var(--is); font-weight: 500; }
  .crop-frame{
    position: relative; width: 100%; overflow: hidden; background:#eee; border-radius: 4px;
    cursor: grab; touch-action: none; user-select: none;
  }
  .crop-frame:active{ cursor: grabbing; }
  .crop-frame img{ position:absolute; top:50%; left:50%; width:100%; height:100%; object-fit: cover; }
  .crop-controls{ display:flex; align-items:center; gap: 10px; margin-top: 14px; }
  .crop-controls input[type=range]{ flex: 1; }
  .crop-actions{ display:flex; justify-content: space-between; margin-top: 16px; }
  .crop-actions button{
    font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: var(--rd); cursor: pointer;
  }
  .btn-done{ background: var(--ik); color:#fff; border:none; }
  .btn-remove{ background:#fff; border:1px solid var(--dg); color: var(--dg); }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>
<div id="app">

  <nav class="tool-nav">
    <a href="estimate.html">かんたん見積もり</a>
    <a href="reference-sheet.html" class="active">資料まとめシート</a>
  </nav>

  <div class="page-head">
    <h1>資料まとめシート</h1>
    <p>キャラクターの立ち絵・顔画像・カラーパレット・ご依頼内容を、1枚の画像にまとめてダウンロードできます。画像はクリックすると位置とズームを調整できます。</p>
  </div>

  <div class="mode-tabs">
    <button :class="{active: mode==='solo'}" @click="mode='solo'">1人</button>
    <button :class="{active: mode==='duo'}" @click="mode='duo'">2人</button>
  </div>

  <div class="canvas-wrap" ref="canvasWrap">
    <div class="canvas-scale-box" :style="{ width: (canvasW*previewScale)+'px', height: (canvasH*previewScale)+'px' }">
      <div class="sheet" ref="canvasArea" :style="{ width: canvasW+'px', height: canvasH+'px', transform: 'scale('+previewScale+')', transformOrigin: 'top left' }">

        <!-- 1人：左情報パネル -->
        <div class="info-panel" v-if="mode==='solo'" :style="{flex: '2 0 0%'}">
          <panel-content :panel="panels[0]" :panel-idx="0" :on-face-click="onFaceClick" :on-add-face="addFace" :on-remove-face="removeFace" :on-color-click="triggerColorPicker" :on-remove-color="removeColor"></panel-content>
        </div>

        <!-- 2人：左情報パネル -->
        <div class="info-panel" v-if="mode==='duo'" :style="{flex: '1 0 0%'}">
          <panel-content :panel="panels[0]" :panel-idx="0" :on-face-click="onFaceClick" :on-add-face="addFace" :on-remove-face="removeFace" :on-color-click="triggerColorPicker" :on-remove-color="removeColor"></panel-content>
        </div>

        <!-- 1人：立ち絵1枚 -->
        <div class="img-slot" v-if="mode==='solo'" :style="{flex: '1 0 0%'}" @click="onIllustClick(0)">
          <img class="slot-img" v-if="illustrations[0].url" :src="illustrations[0].url" :style="imgTransform(illustrations[0])">
          <div class="plus" v-else><span>＋</span></div>
          <div class="edit-mark" v-if="illustrations[0].url">位置調整</div>
        </div>

        <!-- 2人：立ち絵2枚 -->
        <div class="illust-pair" v-if="mode==='duo'" :style="{flex: '1.2 0 0%'}">
          <div class="img-slot" @click="onIllustClick(0)">
            <img class="slot-img" v-if="illustrations[0].url" :src="illustrations[0].url" :style="imgTransform(illustrations[0])">
            <div class="plus" v-else><span>＋</span></div>
            <div class="edit-mark" v-if="illustrations[0].url">位置調整</div>
          </div>
          <div class="img-slot" @click="onIllustClick(1)">
            <img class="slot-img" v-if="illustrations[1].url" :src="illustrations[1].url" :style="imgTransform(illustrations[1])">
            <div class="plus" v-else><span>＋</span></div>
            <div class="edit-mark" v-if="illustrations[1].url">位置調整</div>
          </div>
        </div>

        <!-- 2人：右情報パネル -->
        <div class="info-panel" v-if="mode==='duo'" :style="{flex: '1 0 0%'}">
          <panel-content :panel="panels[1]" :panel-idx="1" :on-face-click="onFaceClick" :on-add-face="addFace" :on-remove-face="removeFace" :on-color-click="triggerColorPicker" :on-remove-color="removeColor"></panel-content>
        </div>

      </div>
    </div>
  </div>

  <button class="btn-primary" @click="downloadPNG" :disabled="generating">
    {{ generating ? '作成中…' : 'PNG画像でダウンロード' }}
  </button>

  <input type="file" accept="image/*" ref="fileInput" style="display:none" @change="onFileChosen">
  <input type="color" ref="colorInput" style="display:none" @change="onColorChosen">

  <!-- ===== crop modal ===== -->
  <div class="crop-overlay" v-if="editing" @click.self="closeEditor">
    <div class="crop-box">
      <h4>位置とズームを調整（ドラッグで移動）</h4>
      <div class="crop-frame" :style="{ aspectRatio: editing.aspect }" ref="cropFrame" @mousedown="startDrag" @touchstart="startDrag">
        <img :src="editingSlot.url" :style="imgTransform(editingSlot)">
      </div>
      <div class="crop-controls">
        <span style="font-size:12px;color:#888;">ズーム</span>
        <input type="range" min="1" max="3" step="0.01" v-model.number="editingSlot.scale">
      </div>
      <div class="crop-actions">
        <button class="btn-remove" @click="removeEditingImage">画像を削除</button>
        <button class="btn-done" @click="closeEditor">完了</button>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function makeImageSlot(){
  return { url: null, scale: 1, tx: 0, ty: 0 };
}

function makePanel(){
  return {
    basic: '', appearance: '', hobby: '', likes: '', dislikes: '', personality: '', ng: '',
    faces: [makeImageSlot(), makeImageSlot()],
    palette: []
  };
}

const PanelContent = {
  props: ['panel', 'panelIdx', 'onFaceClick', 'onAddFace', 'onRemoveFace', 'onColorClick', 'onRemoveColor'],
  template: `
    <div class="panel-text">
      <div class="field-block">
        <label>基礎情報（名前・性別・身長体重・利き手・スリーサイズ・MBTIなど）</label>
        <textarea v-model="panel.basic" rows="2"></textarea>
      </div>
      <div class="field-block">
        <label>容姿情報（箇条書き推奨）</label>
        <textarea v-model="panel.appearance" rows="3"></textarea>
      </div>
      <div class="field-block">
        <label>趣味・特技</label>
        <textarea v-model="panel.hobby" rows="2"></textarea>
      </div>
      <div class="field-block">
        <label>好きなもの</label>
        <textarea v-model="panel.likes" rows="2"></textarea>
      </div>
      <div class="field-block">
        <label>苦手なもの</label>
        <textarea v-model="panel.dislikes" rows="2"></textarea>
      </div>
      <div class="field-block">
        <label>人物について（性格など）</label>
        <textarea v-model="panel.personality" rows="2"></textarea>
      </div>
      <div class="field-block">
        <label>NG（この描写はやめてほしい／ここは絶対忘れないでほしい など）</label>
        <textarea v-model="panel.ng" rows="2"></textarea>
      </div>
    </div>
    <div class="panel-bottom">
      <div class="face-grid">
        <div class="img-slot face-slot" v-for="(f, i) in panel.faces" :key="i" @click="onFaceClick(panelIdx, i)">
          <img class="slot-img" v-if="f.url" :src="f.url" :style="$root.imgTransform(f)">
          <div class="plus" v-else>＋</div>
          <div class="edit-mark" v-if="f.url">位置調整</div>
        </div>
      </div>
      <div class="face-controls">
        <button v-if="panel.faces.length < 4" @click.stop="onAddFace(panelIdx)">＋顔画像を追加</button>
        <button v-if="panel.faces.length > 2" @click.stop="onRemoveFace(panelIdx)">−削除</button>
      </div>
      <div class="palette-row">
        <div class="swatch" v-for="(c, i) in panel.palette" :key="i" :style="{background: c}" @click.stop="onRemoveColor(panelIdx, i)" title="クリックで削除"></div>
        <button class="add-color-btn" @click.stop="onColorClick(panelIdx)">＋</button>
      </div>
    </div>
  `
};

const { createApp } = Vue;

const app = createApp({
  components: { PanelContent },
  data(){
    return {
      mode: 'solo',
      canvasW: 1500,
      canvasH: 1000,
      previewScale: 1,
      illustrations: [makeImageSlot(), makeImageSlot()],
      panels: [makePanel(), makePanel()],
      pendingUpload: null,
      pendingColorPanel: null,
      editing: null, // { target:'illustration', index:0, aspect:'...' } | { target:'face', panel:0, index:0, aspect:'1/1' }
      generating: false
    };
  },
  computed: {
    editingSlot(){
      if(!this.editing) return { url: null, scale: 1, tx: 0, ty: 0 };
      if(this.editing.target === 'illustration') return this.illustrations[this.editing.index];
      return this.panels[this.editing.panel].faces[this.editing.index];
    }
  },
  methods: {
    imgTransform(slot){
      return { transform: `translate(${slot.tx}%, ${slot.ty}%) scale(${slot.scale})` };
    },
    updateScale(){
      const wrapEl = this.$refs.canvasWrap;
      if(!wrapEl) return;
      const available = wrapEl.clientWidth - 40;
      this.previewScale = Math.max(0.1, Math.min(1, available / this.canvasW));
    },
    onFaceClick(panelIdx, faceIdx){
      const slot = this.panels[panelIdx].faces[faceIdx];
      if(slot.url){
        this.editing = { target: 'face', panel: panelIdx, index: faceIdx, aspect: '1 / 1' };
      }else{
        this.pendingUpload = { type: 'face', panel: panelIdx, index: faceIdx };
        this.$refs.fileInput.click();
      }
    },
    onIllustClick(idx){
      const slot = this.illustrations[idx];
      if(slot.url){
        const widthFrac = this.mode === 'solo' ? (1 / 3) : ((1.2 / 3.2) / 2);
        const w = Math.round(this.canvasW * widthFrac);
        this.editing = { target: 'illustration', index: idx, aspect: `${w} / ${this.canvasH}` };
      }else{
        this.pendingUpload = { type: 'illustration', index: idx };
        this.$refs.fileInput.click();
      }
    },
    onFileChosen(e){
      const file = e.target.files[0];
      if(!file || !this.pendingUpload) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const url = ev.target.result;
        const slot = makeImageSlot();
        slot.url = url;
        if(this.pendingUpload.type === 'illustration'){
          this.illustrations[this.pendingUpload.index] = slot;
        }else{
          this.panels[this.pendingUpload.panel].faces[this.pendingUpload.index] = slot;
        }
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    },
    addFace(panelIdx){
      if(this.panels[panelIdx].faces.length < 4) this.panels[panelIdx].faces.push(makeImageSlot());
    },
    removeFace(panelIdx){
      if(this.panels[panelIdx].faces.length > 2) this.panels[panelIdx].faces.pop();
    },
    triggerColorPicker(panelIdx){
      this.pendingColorPanel = panelIdx;
      this.$refs.colorInput.click();
    },
    onColorChosen(e){
      if(this.pendingColorPanel === null) return;
      this.panels[this.pendingColorPanel].palette.push(e.target.value);
    },
    removeColor(panelIdx, colorIdx){
      this.panels[panelIdx].palette.splice(colorIdx, 1);
    },
    closeEditor(){
      this.editing = null;
    },
    removeEditingImage(){
      const fresh = makeImageSlot();
      if(this.editing.target === 'illustration'){
        this.illustrations[this.editing.index] = fresh;
      }else{
        this.panels[this.editing.panel].faces[this.editing.index] = fresh;
      }
      this.editing = null;
    },
    startDrag(e){
      e.preventDefault();
      const slot = this.editingSlot;
      const isTouch = e.type === 'touchstart';
      const startX = isTouch ? e.touches[0].clientX : e.clientX;
      const startY = isTouch ? e.touches[0].clientY : e.clientY;
      const startTX = slot.tx, startTY = slot.ty;
      const rect = this.$refs.cropFrame.getBoundingClientRect();

      const move = (ev) => {
        const cx = ev.type === 'touchmove' ? ev.touches[0].clientX : ev.clientX;
        const cy = ev.type === 'touchmove' ? ev.touches[0].clientY : ev.clientY;
        const dx = cx - startX, dy = cy - startY;
        let nx = startTX + (dx / rect.width) * 100;
        let ny = startTY + (dy / rect.height) * 100;
        nx = Math.max(-50, Math.min(50, nx));
        ny = Math.max(-50, Math.min(50, ny));
        slot.tx = nx; slot.ty = ny;
      };
      const up = () => {
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
        window.removeEventListener('touchmove', move);
        window.removeEventListener('touchend', up);
      };
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
      window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('touchend', up);
    },
    async downloadPNG(){
      this.generating = true;
      const savedScale = this.previewScale;
      this.previewScale = 1;
      await this.$nextTick();
      try{
        const canvas = await html2canvas(this.$refs.canvasArea, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
        const link = document.createElement('a');
        link.download = `資料まとめ_${todayStr()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }catch(err){
        console.error(err);
        alert('画像の作成に失敗しました。もう一度お試しください。');
      }finally{
        this.previewScale = savedScale;
        this.generating = false;
      }
    }
  },
  mounted(){
    this.updateScale();
    window.addEventListener('resize', this.updateScale);
  }
});
const vm = app.mount('#app');
</script>
</body>
</html>
